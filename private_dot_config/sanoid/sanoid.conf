# Sanoid snapshot + retention policy.
#
# Read directly from here by the system sanoid units via --configdir; see
# systemd-sanoid.conf.tmpl. Editing this file needs no root.
#
# GOAL: a short rolling window of frequent snapshots on $HOME, so an "oh no"
# moment (rm -rf, a bad script, a botched git reset) is recoverable. This is
# deliberately NOT a long history archive — rpool sits at ~93% capacity, so
# retention is spent where it buys the most.
#
# Snapshots are read-only and invisible to rm, so they survive exactly the
# accident they're here for. They are NOT a backup: they die with the pool.
# For that, syncoid (same package) replicates to another disk or host.
#
# NO `recursive` ANYWHERE, ON PURPOSE. A recursive section pushes its settings
# onto every child dataset and overwrites whatever that child's own section
# set (sanoid ~L1013), so an exclusion only holds if the parent happens to be
# processed first. Ubuntu's ZFS layout splits /var into many datasets and most
# of them must stay excluded, so every dataset is listed explicitly instead.
# Anything not listed here is simply never touched by sanoid.
#
# Sanoid only prunes snapshots it created (autosnap_* naming). Hand-made
# snapshots like bpool@cli or @u24.04 are never touched.

######################################################################
# Datasets — snapshotted
######################################################################

# $HOME — the whole point of this config.
[rpool/USERDATA/joba_ianrrd]
	use_template = home

# / itself (13.9G referenced). Children are separate datasets and are NOT
# included, so this rolls back the root filesystem only.
[rpool/ROOT/ubuntu_dmnrt5]
	use_template = system

# /boot — kept in step with root so kernel and modules match after a rollback.
[bpool/BOOT/ubuntu_dmnrt5]
	use_template = boot

# NetworkManager connection profiles: wifi/VPN credentials. 1.25M, and the most
# irritating thing in /var to reconstruct by hand.
[rpool/ROOT/ubuntu_dmnrt5/var/lib/NetworkManager]
	use_template = system

# Login/user account settings. 544K — free.
[rpool/ROOT/ubuntu_dmnrt5/var/lib/AccountsService]
	use_template = system

[rpool/USERDATA/root_dmnrt5]
	use_template = system

######################################################################
# Deliberately NOT snapshotted — do not add these back without a reason
#
#   rpool/ROOT/ubuntu_dmnrt5/var/lib   43.5G live, container + package churn.
#                                      Measured worst offender: its single
#                                      @u24.04 snapshot pins 13.9G today.
#   rpool/ROOT/ubuntu_dmnrt5/var/log   Append-only; rolling logs back is never
#                                      what you want. @u24.04 pins 1.48G here.
#   rpool/ROOT/ubuntu_dmnrt5/var/snap  Snap app data, regenerable.
#   rpool/ROOT/ubuntu_dmnrt5/var/spool Transient cron/at/print queues.
#   rpool/ROOT/ubuntu_dmnrt5/usr       Empty container dataset (192K).
#   rpool/ROOT/ubuntu_dmnrt5/var       Empty container dataset (192K).
#
# Consequence: rolling back / does not roll back /var/lib. That is also why
# Ubuntu's installer split them out in the first place.
######################################################################

######################################################################
# Templates
######################################################################

# The rolling safety net. frequent_period defaults to 15 minutes and the
# sanoid timer fires every 15, so frequently=8 is a rolling 2-hour window at
# 15-minute granularity. 2h rather than the bare 15 min you asked for: the
# window has to outlast how long it takes to *notice* the mistake, and a
# frequent snapshot only pins blocks deleted since it was taken, so the extra
# depth is nearly free.
#
# Cost check on real numbers: joba_ianrrd carries a snapshot from March 2023
# and it pins 74.5M total. $HOME barely churns. This template is cheap.
[template_home]
	frequently = 8
	hourly = 6
	daily = 3
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_system]
	frequently = 0
	hourly = 0
	daily = 3
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes

[template_boot]
	frequently = 0
	hourly = 0
	daily = 3
	monthly = 0
	yearly = 0
	autosnap = yes
	autoprune = yes
